<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F6F4EF; --surface:#FFFFFF; --sunk:#EFEBE2;
  --ink:#1A1815; --body:#3A3630; --muted:#6E6759; --faint:#8C8579;
  --rule:#DDD7C9; --rule-soft:#E9E4D8;
  --k:#4A453B; --c:#0E7490; --m:#A81F6B; --y:#946A00;
  --gold:#946A00; --good:#2F7A45; --warn:#9A5B00; --bad:#A32C2C;
  --shadow:0 1px 0 rgba(26,24,21,.05), 0 8px 24px -18px rgba(26,24,21,.4);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131210; --surface:#1B1A16; --sunk:#211F1A;
    --ink:#EEE9DE; --body:#CFC8BA; --muted:#9A9285; --faint:#7C7568;
    --rule:#2F2C25; --rule-soft:#26241E;
    --k:#B9B1A1; --c:#4FB6D6; --m:#EE7FB4; --y:#DFAB49;
    --gold:#D9A648; --good:#6FBE86; --warn:#D89A45; --bad:#E08585;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -20px #000;
  }
}
:root[data-theme="dark"]{
  --paper:#131210; --surface:#1B1A16; --sunk:#211F1A;
  --ink:#EEE9DE; --body:#CFC8BA; --muted:#9A9285; --faint:#7C7568;
  --rule:#2F2C25; --rule-soft:#26241E;
  --k:#B9B1A1; --c:#4FB6D6; --m:#EE7FB4; --y:#DFAB49;
  --gold:#D9A648; --good:#6FBE86; --warn:#D89A45; --bad:#E08585;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -20px #000;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--body);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;
  font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Archivo",system-ui,sans-serif;color:var(--ink);
  text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.015em}
code,.mono,kbd{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
a{color:inherit}

/* ── shell ─────────────────────────────────────────── */
.wrap{display:grid;grid-template-columns:236px minmax(0,1fr);gap:0;
  max-width:1360px;margin:0 auto;padding:0 28px}
.rail{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;
  padding:34px 22px 60px 0;border-right:1px solid var(--rule-soft)}
.main{min-width:0;padding:0 0 120px 46px}
@media (max-width:940px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:0 18px}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule-soft);padding:22px 0}
  .main{padding:0 0 90px}
}

/* ── rail ──────────────────────────────────────────── */
.rail .brand{font-family:"Archivo";font-weight:700;font-size:13px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.rail .sub{font-size:12px;color:var(--faint);margin-top:4px;
  font-family:"IBM Plex Mono";letter-spacing:.02em}
.rail nav{display:flex;flex-direction:column;gap:1px;margin-top:26px}
.rail nav a{display:flex;gap:10px;align-items:baseline;text-decoration:none;
  font-family:"IBM Plex Mono";font-size:12.5px;color:var(--muted);
  padding:4px 8px 4px 6px;border-radius:3px;border-left:2px solid transparent}
.rail nav a .n{color:var(--faint);font-size:11px;min-width:16px}
.rail nav a:hover{color:var(--ink);background:var(--sunk)}
.rail nav a.on{color:var(--ink);border-left-color:var(--gold);background:var(--sunk)}
.rail .grp{font-family:"Archivo";font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin:18px 0 6px 6px}

/* ── masthead ──────────────────────────────────────── */
.mast{padding:56px 0 34px;border-bottom:1px solid var(--rule)}
.eyebrow{font-family:"IBM Plex Mono";font-size:11.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.mast h1{font-size:clamp(34px,5.4vw,58px);font-weight:700;letter-spacing:-.03em}
.mast .lede{max-width:62ch;margin-top:18px;font-size:19px;color:var(--body)}
.mast .lede b{color:var(--ink);font-weight:600}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);margin-top:34px}
.counts div{background:var(--paper);padding:14px 14px 13px}
.counts .v{font-family:"Archivo";font-weight:700;font-size:26px;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1}
.counts .l{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);margin-top:7px}

/* ── sections ──────────────────────────────────────── */
section{padding:56px 0 8px;scroll-margin-top:20px}
section+section{border-top:1px solid var(--rule-soft)}
.shead{display:flex;gap:14px;align-items:baseline;margin-bottom:6px}
.shead .num{font-family:"IBM Plex Mono";font-size:12px;color:var(--gold);
  letter-spacing:.08em;padding-top:4px}
section h2{font-size:clamp(23px,3vw,31px);font-weight:600}
section h3{font-size:18px;font-weight:600;margin:38px 0 10px;letter-spacing:-.01em}
section h4{font-size:13px;font-weight:600;font-family:"IBM Plex Mono";
  letter-spacing:.05em;color:var(--muted);margin:26px 0 8px;text-transform:uppercase}
p{max-width:70ch;margin:12px 0}
.dek{max-width:70ch;color:var(--muted);font-size:16px;margin:4px 0 4px 0}
ul,ol{max-width:70ch;padding-left:20px}
li{margin:6px 0}
strong{color:var(--ink);font-weight:600}
code{font-size:.86em;background:var(--sunk);padding:1.5px 5px;border-radius:3px;
  color:var(--ink);border:1px solid var(--rule-soft)}

/* ── figures ───────────────────────────────────────── */
figure{margin:26px 0 6px;padding:0}
.figbox{background:var(--surface);border:1px solid var(--rule);
  padding:22px 20px;overflow-x:auto;box-shadow:var(--shadow)}
figure svg{display:block;max-width:100%;height:auto;color:var(--ink);margin:0 auto}
figcaption{font-size:14px;color:var(--muted);margin-top:11px;max-width:76ch;
  font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;
  font-family:"IBM Plex Mono";font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.sw{width:11px;height:11px;border:1.5px solid currentColor;flex:none}
.sw.fill{background:currentColor}
.sw.rnd{border-radius:50%}

/* ── tables ────────────────────────────────────────── */
.tw{overflow-x:auto;border:1px solid var(--rule);margin:18px 0;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:"IBM Plex Mono";font-size:12.5px}
th{text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);padding:9px 12px;
  border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--sunk);
  position:sticky;top:0;z-index:1}
td{padding:7px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:top;
  color:var(--body)}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums}
td b{color:var(--ink);font-weight:600}
.scrolltbl{max-height:520px;overflow-y:auto}

/* ── chips ─────────────────────────────────────────── */
.chip{display:inline-block;font-family:"IBM Plex Mono";font-size:10px;
  letter-spacing:.06em;padding:1px 6px;border:1px solid currentColor;
  border-radius:2px;white-space:nowrap;line-height:1.6}
.m-GET{color:var(--c)} .m-POST{color:var(--good)} .m-PATCH{color:var(--warn)}
.m-PUT{color:var(--warn)} .m-DELETE{color:var(--bad)}
.t-CORE{color:var(--k)} .t-SALES{color:var(--y)}
.t-MATERIALS{color:var(--c)} .t-ARTWORK{color:var(--m)}
.role{color:var(--faint);font-family:"IBM Plex Mono";font-size:10.5px}

/* ── callouts ──────────────────────────────────────── */
.note{border-left:2px solid var(--gold);background:var(--sunk);
  padding:14px 18px;margin:22px 0;max-width:74ch}
.note p{margin:0;font-size:15.5px}
.note p+p{margin-top:9px}
.note .tag{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold);display:block;margin-bottom:7px}
.warnbox{border-left-color:var(--warn)}
.warnbox .tag{color:var(--warn)}

/* ── filter ────────────────────────────────────────── */
.filter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 0}
.filter input,.filter select{font-family:"IBM Plex Mono";font-size:12.5px;
  padding:7px 10px;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule);border-radius:3px;min-width:0}
.filter input{flex:1;min-width:180px}
.filter .cnt{font-family:"IBM Plex Mono";font-size:11.5px;color:var(--faint);
  font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin:20px 0}
.card{border:1px solid var(--rule);background:var(--surface);padding:16px 18px}
.card h4{margin:0 0 8px}
.card p{font-size:15px;margin:6px 0}
.card ul{font-size:15px;padding-left:18px;margin:8px 0 0}

footer{border-top:1px solid var(--rule);margin-top:60px;padding:26px 0 0;
  font-family:"IBM Plex Mono";font-size:11.5px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── change-spec additions ─────────────────────────── */
.req{border:1px solid var(--rule);background:var(--surface);margin:16px 0;padding:0}
.req>header{display:flex;gap:12px;align-items:baseline;padding:12px 16px;
  border-bottom:1px solid var(--rule-soft);background:var(--sunk)}
.req>header .id{font-family:"IBM Plex Mono";font-size:11px;color:var(--gold);
  letter-spacing:.08em;flex:none}
.req>header h4{margin:0;font-size:15px;font-family:"Archivo";text-transform:none;
  letter-spacing:-.01em;color:var(--ink)}
.req .said{font-style:italic;color:var(--muted);padding:12px 16px 0;font-size:15px;max-width:none}
.req .body{padding:8px 16px 14px}
.req .body p{margin:8px 0;font-size:15.5px;max-width:none}
.req dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;
  margin:12px 0 0;font-size:14px}
.req dt{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);padding-top:3px}
.req dd{margin:0;color:var(--body)}
.req dd code{font-size:.85em}
.sev{display:inline-block;font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.08em;
  padding:1px 6px;border:1px solid currentColor;border-radius:2px;margin-left:auto;flex:none;
  text-transform:uppercase;line-height:1.7}
.sev.new{color:var(--c)} .sev.breaks{color:var(--bad)}
.sev.extend{color:var(--good)} .sev.ask{color:var(--warn)}
pre{font-family:"IBM Plex Mono";font-size:12px;line-height:1.55;background:var(--surface);
  border:1px solid var(--rule);padding:14px 16px;overflow-x:auto;margin:14px 0;
  color:var(--body);tab-size:2}
pre b{color:var(--ink);font-weight:600}
pre i{color:var(--gold);font-style:normal}
pre s{color:var(--bad);text-decoration:line-through;opacity:.75}
pre .c{color:var(--faint)}
.q{border-left:2px solid var(--warn);background:var(--sunk);padding:14px 18px;margin:16px 0;max-width:74ch}
.q .n{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--warn);display:block;margin-bottom:6px}
.q p{margin:0;font-size:15.5px}
.q p+p{margin-top:8px}
.phase{border:1px solid var(--rule);background:var(--surface);padding:16px 18px;margin:14px 0}
.phase h4{margin:0 0 4px;font-family:"Archivo";text-transform:none;font-size:16px;
  letter-spacing:-.01em;color:var(--ink)}
.phase .meta{font-family:"IBM Plex Mono";font-size:11px;color:var(--faint);margin-bottom:10px}
.phase ul{margin:8px 0 0;font-size:15px}
</style>
